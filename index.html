<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>}Currency Exchanger</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-fluid bg-primary-custom vh-100">
      <div class="row">
        <h1
          class="col-12 text-secondary-custom p-5 d-flex justify-content-center"
        >
          Currency Converter
        </h1>
      </div>
      <div class="row justify-content-center">
        <div class="col-10 col-md-8 bg-secondary-custom p-3 m-3 fs-3 rounded-3">
          <p class="fs-3 d-inline">$</p>
          <input
            class="from-amount-input col-10 col-md-5 border-0 bg-secondary-custom p-2 fs-3"
            type="text"
            placeholder="1 By Default"
          />
          <select
            class="from-amount-select col-11 col-md-6 p-1 border-0 bg-secondary-custom text-center"
            name=""
            id=""
          >
          </select>
        </div>
      </div>
      <div class="row justify-content-center">
        <img
          class="swap-btn m-1"
          src="images/SVGs/points-and-dollars-exchange-svgrepo-com.svg"
          alt=""
        />
      </div>
      <div class="row justify-content-center">
        <div class="col-10 col-md-8 bg-secondary-custom p-3 m-3 fs-3 rounded-3">
          <p class="fs-3 d-inline">$</p>
          <input
            class="to-amount-input col-10 col-md-5 border-0 bg-secondary-custom p-2 fs-3 text-primary-custom"
            type="text"
            disabled
          />
          <select
            class="to-amount-select col-11 col-md-6 p-1 border-0 bg-secondary-custom text-center"
            name=""
            id=""
          >
          </select>
        </div>
      </div>
      <div class="row justify-content-center m-4">
        <p class="col-3 btn btn-outline-custom fw-bold">Convert</p>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <script src="./js/main.js" type="module"></script>
  </body>
</html>
